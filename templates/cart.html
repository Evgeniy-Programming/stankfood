<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина - Кафе-"Бургерная"</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #818cb9;
            padding: 10px 20px;
            display: flex;
            align-items: center;
        }
        .logo {
            width: 80px;
            height: auto;
            margin-right: -20px;
        }
        .logo img {
            width: 100%;
            height: auto;
            object-fit: cover;
            background-color: transparent;
        }
        nav {
            display: flex;
            justify-content: center;
            flex-grow: 1;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-size: 18px;
            font-weight: bold;
        }
        .cart-container {
            width: 500px;
            margin: auto;
            margin-top: 30px;
            padding: 20px;
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .cart-header {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            border-bottom: 1px solid #ccc;
        }
        .cart-item img {
            width: 50px;
            height: auto;
            margin-right: 10px;
        }
        .cart-item-name {
            flex-grow: 1;
        }
        .cart-item-price {
            font-weight: bold;
        }
        .cart-total {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            text-align: right;
        }
        .checkout-button {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #818cb9;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
        .checkout-button:hover {
            background-color: rgb(32, 165, 231);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <a href="{{ url_for('main') }}">
                <img src="/static/images/myPizza4.png" alt="Логотип"> 
            </a>
        </div>
        <nav>
            <a href="{{url_for('main')}}">Главная</a>
            <a href="menu.html">Меню</a>
            <a href="support.html">Поддержка</a>
            <a href="more.html">Еще</a>
        </nav>
    </header>
    <div class="cart-container">
        <div class="cart-header">Ваша корзина</div>
        <div id="cart-container"></div>
        <div class="cart-total" id="cart-total"></div>
        <button class="checkout-button">Оформить заказ</button>
    </div>
    <script>const userId = {{current_user.id}}</script>
    <script src="/static/cart.js"></script>
</body>
</html>
