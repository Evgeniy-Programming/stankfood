<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль пользователя</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f4;
    }
    header {
      background-color: #818cb9;
      padding: 10px 20px;
      display: flex;
      align-items: center;
    }
    .logo {
      width: 80px;
      height: auto;
      margin-right: -20px;
    }
    .logo img {
      width: 100%;
      height: auto;
      object-fit: cover;
      background-color: transparent;
    }
    nav {
      display: flex;
      justify-content: center;
      flex-grow: 1;
    }
    nav a {
    color: white;
    text-decoration: none;
    margin: 0 20px;
    font-size: 18px;
    font-weight: bold;
    }
    .profile-container {
      background-color: #fff;
      margin: 50px auto;
      max-width: 900px;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }
    .profile-header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }
    .profile-header h2 {
      margin: 0;
      font-size: 24px;
      color: #333;
    }
    .profile-wrapper {
      display: flex;
      flex-wrap: wrap;
    }
    .form-section {
      flex: 1;
      padding: 20px;
      min-width: 300px;
    }
    .photo-section {
      flex: 1;
      padding: 20px;
      background-color: #fafafa;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 300px;
    }
    .photo-section img {
      max-width: 100%;
      height: auto;
    }
    .photo-caption {
      font-size: 18px;
      color: #333;
      margin-bottom: 15px;
      font-weight: bold;
    }
    .form-group {
      margin-bottom: 20px;
      position: relative;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
      background-color: #fafafa;
    }
    .form-group input[readonly] {
      color: #333;
    }
    .password-container {
      position: relative;
    }
    .toggle-password {
      position: absolute;
      top: 75%;
      right: 20px;
      transform: translateY(-50%);
      cursor: pointer;
      background: none;
      border: none;
      font-size: 18px;
    }
    /* Стили для блока аватара внутри формы */
    .avatar-group {
      text-align: center;
      margin-bottom: 20px;
    }
    .avatar-group img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ccc;
    }
    /* Стили для кнопок «Сохранить» и «Редактировать» */
    .action-buttons {
      margin-top: 20px;
      text-align: center;
    }
    .action-buttons button {
      padding: 10px 20px;
      font-size: 14px;
      margin: 0 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .action-buttons .save-btn {
      background-color: #4def73;
      color: #fff;
    }
    .action-buttons .edit-btn {
      background-color: #818cb9;
      color: #fff;
    }
  </style>
<header>
  <div class="logo">
      <a href="{{ url_for('main') }}">
          <img src="/static/images/myPizza4.png" alt="Логотип"> 
      </a>
  </div>
  <nav>
      <a href="{{url_for('main')}}">Главная</a>
      <a href="menu.html">Меню</a>
      <a href="support.html">Поддержка</a>
      <a href="more.html">Еще</a>
  </nav>
</header>
</head>
<body>
  <div class="profile-container">
    <div class="profile-header">
      <h2>Профиль пользователя</h2>
    </div>
    <div class="profile-wrapper">
      <!-- Левая колонка: форма с данными и аватаром -->
      <div class="form-section">
        <form id="profileForm">
          <div class="avatar-group form-group">
            <img src="/static/images/profimg.png" alt="Аватар">
          </div>
          <div class="form-group">
            <label for="username">Имя пользователя<span style="color: red;">*</span></label>
            <input type="text" id="username" name="username" value="{{ username }}">
        </div>
        <div class="form-group">
            <label for="email">Email<span style="color: red;">*</span></label>
            <input type="email" id="email" name="email" value="{{ email }}">
        </div>
        <div class="form-group">
            <label for="phone">Номер телефона<span style="color: red;">*</span></label>
            <input type="tel" id="phone" name="phone" value="{{ phone }}">
        </div>
        <div class="form-group password-container">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" value="">
            <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password')">👁</button>
        </div>
        </form>
        <div class="action-buttons">
          <button type="button" class="save-btn" onclick="saveProfile()">Сохранить</button>
          <button type="button" class="edit-btn" onclick="toggleEdit()">Редактировать</button>
      </div>      
      </div>
      <!-- Правая колонка: место для большой фотографии с надписью сверху -->
      <div class="photo-section">
        <div class="photo-caption">Посещения столовой</div>
        <img src="/static/images/maintenance.png" alt="Большая фотография">
      </div>
    </div>
  </div>
  <script>
    function togglePasswordVisibility(fieldId) {
      const passwordField = document.getElementById(fieldId);
      const toggleButton = passwordField.nextElementSibling;
      if (passwordField.type === "password") {
        passwordField.type = "text";
        toggleButton.textContent = "🙈";
      } else {
        passwordField.type = "password";
        toggleButton.textContent = "👁";
      }
    }
    function toggleEdit() {
    const inputs = document.querySelectorAll('.form-group input');
    inputs.forEach(input => {
        input.readOnly = !input.readOnly; // Переключаем состояние readOnly
    });
    }
    function saveProfile() {
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;
        const password = document.getElementById('password').value;
        // Отправка данных на сервер
        fetch('/profile', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                name: username,
                email: email,
                phone: phone,
                password: password // Отправляем пароль только если он был изменен
            })
        })
        .then(response => {
            if (response.ok) {
                alert("Данные профиля успешно обновлены.");
                location.reload(); // Перезагрузка страницы для обновления данных
            } else {
                alert("Ошибка при обновлении данных.");
            }
        })
        .catch(error => {
            console.error('Ошибка:', error);
        });
      }
  </script>
</body>
</html>
