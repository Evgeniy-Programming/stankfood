<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кафе-"Бургерная"</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }
        header {
            background-color: #818cb9;
            padding: 10px 20px;
            display: flex;
            align-items: center;
        }
        .logo {
            width: 80px;
            height: auto;
            margin-right: -20px;
        }
        .logo img {
            width: 100%;
            height: auto;
            object-fit: cover;
            background-color: transparent;
        }
        nav {
            display: flex;
            justify-content: center;
            flex-grow: 1;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-size: 18px;
            font-weight: bold;
        }
        .search-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        .search-container input {
            width: 300px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        .image-slider {
            position: relative;
            width: 100%;
            overflow: hidden;
            height: 500px;
            margin-bottom: 10px;
        }
        .image-slider img {
            width: 100%;
            height: auto;
            display: none;
        }
        .image-slider img:first-child {
            display: block;
        }
        .categories {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        .categories button {
            margin: 0 10px;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #818cb9;
            color: white;
            cursor: pointer;
        }
        .categories button:hover {
            background-color: rgb(32, 165, 231);
        }
        .menu-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px;
        }
        .menu-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 10px;
            background-color: white;
            border-radius: 5px;
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            width: 200px;
            cursor: pointer;
        }
        .menu-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }
        .heart-icon {
            cursor: pointer;
            font-size: 24px;
            color: black;
        }
        .menu-item img {
            width: 100px;
            height: auto;
            margin: 10px 0;
        }
        .menu-footer {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
        }
        .price {
            font-size: 16px;
        }
        .plus-icon {
            cursor: pointer;
            font-size: 24px;
        }
        /* Стили для модального окна */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
        .modal1 {
            display: none; /* Скрыто по умолчанию */
            position: fixed; /* Остается на месте */
            z-index: 1; /* Сидит на верхнем уровне */
            left: 0;
            top: 0;
            width: 100%; /* Полная ширина */
            height: 100%; /* Полная высота */
            overflow: auto; /* Включает прокрутку, если нужно */
            background-color: rgb(0,0,0); /* Черный фон с прозрачностью */
            background-color: rgba(0,0,0,0.4); /* Черный фон с прозрачностью */
        }
        .modal1-content {
            background-color: #fefefe;
            margin: 15% auto; /* 15% сверху и центрирование */
            padding: 20px;
            border: 1px solid #888;
            width: 80%; /* Ширина */
        }
        /* Стили для кнопки корзины */
        .cart-button {
            position: fixed;
            bottom: 20px; /* Отступ от нижней части страницы */
            right: 20px; /* Отступ от правой части страницы */
            background-color: #818cb9; /* Цвет фона */
            border-radius: 50%; /* Круглая форма */
            padding: 10px; /* Отступы внутри кнопки */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3); /* Тень для кнопки */
            z-index: 1000; /* Обеспечивает, что кнопка будет поверх других элементов */
        }
        .cart-button img {
            width: 40px; /* Ширина иконки */
            height: auto; /* Высота пропорционально ширине */
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <a href="{{ url_for('main') }}">
                <img src="/static/images/myPizza4.png" alt="Логотип"> 
            </a>
        </div>
        <nav>
            <a href="{{url_for('main')}}">Главная</a>
            <a href="menu.html">Меню</a>
            <a href="support.html">Поддержка</a>
            <a href="more.html">Еще</a>
        </nav>
    </header>
    <div class="search-container">
        <input type="text" placeholder="Поиск по меню">
    </div>
    <div class="image-slider">
        <img src="/static/images/scrollimg1.jpg" alt="Изображение 1">
        <img src="/static/images/scrollimg2.jpg" alt="Изображение 2">
        <img src="/static/images/scrollimg3.jpg" alt="Изображение 3">
    </div>
    <div class="categories">
        <button onclick="filterDishes('Все')">Все</button>
        <button onclick="filterDishes('Супы')">Супы</button>
        <button onclick="filterDishes('Горячее')">Горячее</button>
        <button onclick="filterDishes('Напитки')">Напитки</button>
        <button onclick="filterDishes('Выпечка')">Выпечка</button>
        <button onclick="filterDishes('Десерты')">Десерты</button>
    </div>
    <div class="menu-list" id="menu-list"></div>
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <span id="close-modal" class="close">&times;</span>
            <h2>Редактировать блюдо</h2>
            <label for="dish-name">Название блюда:</label>
            <input type="text" id="dish-name" placeholder="Название">
            <label for="dish-price">Цена:</label>
            <input type="text" id="dish-price" placeholder="Цена">
            <button id="save-button">Сохранить</button>
        </div>
    </div>
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Авторизация</h2>
            <form id="loginForm">
                <label for="phone">Логин:</label>
                <input type="text" id="phone" name="phone" required>
                <label for="password">Пароль:</label>
                <input type="password" id="password" name="password" required>
                <button type="submit">Войти</button>
            </form>
        </div>
    </div>
    <!-- Иконка-кнопка корзины -->
    <a href="{{url_for('cart')}}" class="cart-button">
        <img src="/static/images/cart.png" alt="Корзина" />
    </a>
    <script>
        const restaurantId = {{ restaurant_id }};
    </script>
    <script src="/static/stolov1.js"></script>
</body>
</html>
